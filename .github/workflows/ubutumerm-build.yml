name: UbuntuTerm Build

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      bootstrap_run_id:
        description: "Optional prior Actions run ID from which to reuse a compiled bootstrap-aarch64 artifact"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ubutumerm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERMUX_PACKAGE_VARIANT: apt-android-7
  UBUNTUTERM_BOOTSTRAP_LOCAL_ONLY: "1"
  TERMUX_PACKAGES_COMMIT: b189a79f3b9606b108b45460a4c50756d91e2b9d
  UBUNTU_VERSION: 26.04.1
  UBUNTU_ARCHIVE: ubuntu-base-26.04.1-base-arm64.tar.gz
  UBUNTU_URL: https://cdimage.ubuntu.com/ubuntu-base/releases/26.04.1/release/ubuntu-base-26.04.1-base-arm64.tar.gz
  UBUNTU_SHA256: 5a1906794ced63a71a8119c3f211ef5f0bbe0a243001b4bbd41fdf80c5b219fd

jobs:
  build:
    name: Build & verify UbuntuTerm (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Show runner resources
        run: |
          df -h /
          free -h
          nproc

      - name: Reclaim unused runner disk space (preserve Android SDK)
        if: ${{ inputs.bootstrap_run_id == '' }}
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download pre-compiled custom bootstrap from a prior run
        if: ${{ inputs.bootstrap_run_id != '' }}
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: bootstrap-aarch64
          run-id: ${{ inputs.bootstrap_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: termux-packages/output

      - name: Prepare termux-packages at the pinned upstream commit and apply the UbuntuTerm patch
        if: ${{ inputs.bootstrap_run_id == '' }}
        run: |
          set -euo pipefail
          git init termux-packages
          cd termux-packages
          git remote add origin https://github.com/termux/termux-packages.git
          git fetch --depth 1 origin "$TERMUX_PACKAGES_COMMIT"
          git checkout FETCH_HEAD
          git apply "$GITHUB_WORKSPACE/patches/termux-packages-ubutumerm.patch"
          mkdir -p output

      - name: Start the isolated Termux package-builder container
        if: ${{ inputs.bootstrap_run_id == '' }}
        working-directory: termux-packages
        run: |
          set -euo pipefail
          docker pull ghcr.io/termux/package-builder:latest
          docker run -d --init \
            --name ubutumerm-builder \
            --cap-add CAP_SYS_ADMIN \
            --cap-add SYS_PTRACE \
            --device /dev/fuse \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --shm-size=2g \
            -v "$PWD:/home/builder/termux-packages" \
            -w /home/builder/termux-packages \
            ghcr.io/termux/package-builder:latest \
            sleep infinity

          RUNNER_UID="$(id -u)"
          RUNNER_GID="$(id -g)"
          if [ "$RUNNER_UID" != "1001" ]; then
            docker exec -u 0 ubutumerm-builder usermod -u "$RUNNER_UID" builder
            docker exec -u 0 ubutumerm-builder groupmod -g "$RUNNER_GID" builder
            docker exec -u 0 ubutumerm-builder chown -R "$RUNNER_UID:$RUNNER_GID" /home/builder /data
          fi

          docker exec -u 0 ubutumerm-builder bash -c '
            mkdir -p /data/data/com.ubutumerm.app /data/data/.built-packages
            chown -R builder:builder /data/data/com.ubutumerm.app /data/data/.built-packages
            ln -sfn /data/data/com.ubutumerm.app/aosp /system
            sysctl -w kernel.pid_max=65535 || echo 65535 > /proc/sys/kernel/pid_max || true
          '

      - name: Compile the custom bootstrap from source (aarch64)
        if: ${{ inputs.bootstrap_run_id == '' }}
        working-directory: termux-packages
        run: |
          set -euo pipefail
          : > output/bootstrap-aarch64-build.log

          (
            tail -n +1 -f output/bootstrap-aarch64-build.log | \
              grep --line-buffered -E "termux - build of|\[\*\] (Building|Extracting|Creating|Finished)|built - skipping|ERROR:" || true
          ) &
          TAIL_PID=$!
          trap 'kill "$TAIL_PID" 2>/dev/null || true' EXIT

          docker exec -e CI=true -u builder -w /home/builder/termux-packages ubutumerm-builder \
            bash -c '
              exec </dev/null >output/bootstrap-aarch64-build.log 2>&1
              ./scripts/build-bootstraps.sh --architectures aarch64
              rc=$?
              gpgconf --kill all >/dev/null 2>&1 || pkill -u builder gpg-agent >/dev/null 2>&1 || true
              exit $rc
            '

          sleep 2
          kill "$TAIL_PID" 2>/dev/null || true
          docker rm -f ubutumerm-builder >/dev/null 2>&1 || true
          ls -lh output/bootstrap-aarch64.zip

      - name: Upload the compiled custom bootstrap
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: bootstrap-aarch64
          path: termux-packages/output/bootstrap-aarch64.zip
          retention-days: 30

      - name: Slim down and audit the custom bootstrap (aarch64)
        working-directory: termux-packages
        run: |
          set -euo pipefail
          ZIP_PATH="output/bootstrap-aarch64.zip"
          AUDIT_REPORT="output/bootstrap-aarch64-audit.txt"
          test -f "$ZIP_PATH"

          AUDIT_DIR="/tmp/audit-aarch64"
          rm -rf "$AUDIT_DIR"
          mkdir -p "$AUDIT_DIR"
          unzip -q "$ZIP_PATH" -d "$AUDIT_DIR"

          {
            echo "=== UbuntuTerm custom bootstrap audit (aarch64) ==="
            echo "Archive: $ZIP_PATH"
            echo "Size: $(stat -c%s "$ZIP_PATH") bytes"
            echo "SHA256: $(sha256sum "$ZIP_PATH" | awk '{print $1}')"
            echo ""
            echo "--- Required files check ---"
            for req in SYMLINKS.txt bin/bash bin/apt bin/dpkg bin/pkg bin/proot bin/xz bin/tar etc/apt/sources.list; do
              if [ -e "$AUDIT_DIR/$req" ] || grep -qE "←\./${req}$" "$AUDIT_DIR/SYMLINKS.txt"; then
                echo "[OK] $req"
              else
                echo "[FAIL] Missing $req"
                exit 1
              fi
            done

            echo ""
            echo "--- ELF isolation check (no functional reference to the Termux prefix) ---"
            ELF_COUNT=0
            RUNPATH_COUNT=0
            while IFS= read -r -d '' f; do
              if [ "$(head -c 4 "$f" 2>/dev/null | wc -c)" -eq 4 ] && head -c 4 "$f" | grep -qa $'\x7fELF'; then
                ELF_COUNT=$((ELF_COUNT + 1))
                # The output is captured first: "command | grep -q" would kill the command
                # with SIGPIPE, which "pipefail" reports as a failure of the whole pipeline.
                runpath="$(readelf -d "$f" 2>/dev/null | grep -E 'RUNPATH|RPATH' || true)"
                if printf '%s' "$runpath" | grep -q "/data/data/com.termux"; then
                  echo "[FAIL] Original prefix in DT_RUNPATH of $f"
                  exit 1
                fi
                if strings "$f" 2>/dev/null | grep -q "/data/data/com.termux/files/usr"; then
                  echo "[FAIL] Original prefix string found in ELF binary $f"
                  exit 1
                fi
                if printf '%s' "$runpath" | grep -q "/data/data/com.ubutumerm.app/files/usr"; then
                  RUNPATH_COUNT=$((RUNPATH_COUNT + 1))
                fi
              fi
            done < <(find "$AUDIT_DIR" -type f -print0)
            echo "[PASS] Audited $ELF_COUNT ELF binaries: no functional reference to /data/data/com.termux"
            echo "RUNPATH of the main binaries:"
            for probe in bin/bash bin/apt bin/dpkg bin/proot bin/coreutils; do
              if [ -e "$AUDIT_DIR/$probe" ]; then
                echo "  $probe -> $(readelf -d "$AUDIT_DIR/$probe" 2>/dev/null | grep -E 'RUNPATH|RPATH' | head -1 | sed -E 's/.*(\[.*\])/\1/' || echo none)"
              fi
            done
            echo "Distinct RUNPATH values found:"
            while IFS= read -r -d '' f; do
              if [ "$(head -c 4 "$f" 2>/dev/null | wc -c)" -eq 4 ] && head -c 4 "$f" | grep -qa $'\x7fELF'; then
                readelf -d "$f" 2>/dev/null | grep -E 'RUNPATH|RPATH' || true
              fi
            done < <(find "$AUDIT_DIR" -type f -print0) | sed -E 's/.*(\[.*\])/\1/' | sort | uniq -c | sort -rn | head -10
            if [ "$RUNPATH_COUNT" -lt 1 ]; then
              echo "[WARN] No ELF binary uses /data/data/com.ubutumerm.app/files/usr as RUNPATH"
            else
              echo "[PASS] $RUNPATH_COUNT ELF binaries use /data/data/com.ubutumerm.app/files/usr as RUNPATH"
            fi

            echo ""
            echo "--- UbuntuTerm prefix check ---"
            if ! strings "$AUDIT_DIR/bin/proot" | grep -q "/data/data/com.ubutumerm.app/files/usr"; then
              echo "[FAIL] proot does not reference the UbuntuTerm prefix"
              exit 1
            fi
            echo "[PASS] proot references /data/data/com.ubutumerm.app/files/usr"

            echo ""
            echo "--- Zero contamination scan across scripts, shebangs, configs and SYMLINKS.txt ---"
            if grep -rn "/data/data/com.termux" \
              "$AUDIT_DIR/etc" \
              "$AUDIT_DIR/var" \
              "$AUDIT_DIR/SYMLINKS.txt" > /tmp/contamination.txt 2>&1; then
              echo "[FAIL] Found /data/data/com.termux contamination:"
              cat /tmp/contamination.txt
              exit 1
            fi
            echo "[PASS] Zero active references to /data/data/com.termux"
          } | tee "$AUDIT_REPORT"

      - name: Strip runtime-unneeded files and re-pack the bootstrap
        working-directory: termux-packages
        run: |
          set -euo pipefail
          SLIM_DIR="/tmp/bootstrap-slim"
          rm -rf "$SLIM_DIR"
          mkdir -p "$SLIM_DIR"
          unzip -q output/bootstrap-aarch64.zip -d "$SLIM_DIR"

          # Development headers, manuals and info pages are not needed at runtime and would
          # increase the size of the APK by more than 10 MB.
          rm -rf "$SLIM_DIR/include" "$SLIM_DIR/share/doc" "$SLIM_DIR/share/man" \
                 "$SLIM_DIR/share/info" "$SLIM_DIR/share/misc"

          # Drop the symlink definitions that point into the removed directories, so that no
          # dangling symlinks are created during the bootstrap installation.
          if [ -f "$SLIM_DIR/SYMLINKS.txt" ]; then
            grep -vE '←\./(include|share/doc|share/man|share/info|share/misc)/' \
              "$SLIM_DIR/SYMLINKS.txt" > "$SLIM_DIR/SYMLINKS.txt.new" || true
            mv "$SLIM_DIR/SYMLINKS.txt.new" "$SLIM_DIR/SYMLINKS.txt"
          fi

          OUT_DIR="$PWD/output"
          mkdir -p "$OUT_DIR"
          rm -f "$OUT_DIR/bootstrap-aarch64-slim.zip"
          (cd "$SLIM_DIR" && zip -r9 "$OUT_DIR/bootstrap-aarch64-slim.zip" ./* > /dev/null)
          ls -lh "$OUT_DIR/bootstrap-aarch64-slim.zip"
          cp -v "$OUT_DIR/bootstrap-aarch64-slim.zip" "$OUT_DIR/bootstrap-aarch64.zip"
          df -h /

      - name: Prepare the bundled Ubuntu rootfs asset
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/ubuntu

          echo "Downloading the official Ubuntu base image..."
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/ubuntu-base.tar.gz "$UBUNTU_URL"

          echo "$UBUNTU_SHA256  /tmp/ubuntu-base.tar.gz" | sha256sum -c -
          echo "[PASS] The downloaded image matches the official SHA-256"

          rm -rf /tmp/ubuntu-rootfs && mkdir -p /tmp/ubuntu-rootfs
          tar -xzf /tmp/ubuntu-base.tar.gz -C /tmp/ubuntu-rootfs
          tar -cf /tmp/ubuntu-base.tar -C /tmp/ubuntu-rootfs .

          echo "Compressing the rootfs for bundling..."
          xz -9 -T1 -c /tmp/ubuntu-base.tar > "app/src/main/assets/ubuntu/$UBUNTU_ARCHIVE.xz"

          # The archive is stored with the ".tar.xz" name inside the APK.
          mv "app/src/main/assets/ubuntu/$UBUNTU_ARCHIVE.xz" \
             "app/src/main/assets/ubuntu/${UBUNTU_ARCHIVE%.tar.gz}.tar.xz"

          ARCHIVE_NAME="${UBUNTU_ARCHIVE%.tar.gz}.tar.xz"
          ARCHIVE_SHA="$(sha256sum "app/src/main/assets/ubuntu/$ARCHIVE_NAME" | awk '{print $1}')"
          TAR_SHA="$(sha256sum /tmp/ubuntu-base.tar | awk '{print $1}')"

          cat > app/src/main/assets/ubuntu/rootfs-manifest.properties <<EOF
          # UbuntuTerm bundled Ubuntu rootfs manifest
          # The archive is derived from the official Ubuntu base image and verified against the
          # SHA-256 that is pinned in UbuntuConstants.ROOTFS_SHA256.
          source_url=$UBUNTU_URL
          source_sha256=$UBUNTU_SHA256
          archive_name=$ARCHIVE_NAME
          archive_sha256=$ARCHIVE_SHA
          archive_format=xz
          tar_sha256=$TAR_SHA
          ubuntu_version=$UBUNTU_VERSION
          ubuntu_codename=resolute
          ubuntu_arch=arm64
          EOF

          rm -rf /tmp/ubuntu-rootfs /tmp/ubuntu-base.tar /tmp/ubuntu-base.tar.gz
          ls -lh app/src/main/assets/ubuntu/
          cat app/src/main/assets/ubuntu/rootfs-manifest.properties

      - name: Stage the custom arm64 bootstrap
        run: |
          set -euo pipefail
          mkdir -p app/src/main/cpp
          cp -v termux-packages/output/bootstrap-aarch64.zip app/src/main/cpp/bootstrap-aarch64.zip

      - name: Set up the optional release signing key
        id: signing
        run: |
          set -euo pipefail
          if [ -n "${UBUNTUTERM_KEYSTORE_BASE64:-}" ]; then
            echo "$UBUNTUTERM_KEYSTORE_BASE64" | base64 -d > /tmp/ubutumerm-release.jks
            echo "keystore=/tmp/ubutumerm-release.jks" >> "$GITHUB_OUTPUT"
            echo "signed=release" >> "$GITHUB_OUTPUT"
            echo "[INFO] A release keystore was provided: the APK will be signed with it."
          else
            echo "signed=test" >> "$GITHUB_OUTPUT"
            echo "[INFO] No release keystore configured: the APK is a TEST build signed with the public test key."
          fi

      - name: Build the release APK
        env:
          UBUNTUTERM_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore }}
          UBUNTUTERM_KEYSTORE_PASSWORD: ${{ secrets.UBUNTUTERM_KEYSTORE_PASSWORD }}
          UBUNTUTERM_KEY_ALIAS: ${{ secrets.UBUNTUTERM_KEY_ALIAS }}
          UBUNTUTERM_KEY_PASSWORD: ${{ secrets.UBUNTUTERM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SDKMGR="$(find "$ANDROID_HOME" -name sdkmanager -type f | sed -n '1p')"
          if [ -n "$SDKMGR" ]; then
            (set +o pipefail; yes | "$SDKMGR" --sdk_root="$ANDROID_HOME" --licenses > /dev/null) || true
          fi
          chmod +x ./gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Static analysis with Android Lint
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:lintRelease
          mkdir -p final-output/reports
          cp -f app/build/reports/lint-results-release.html final-output/reports/ 2>/dev/null || true
          cp -f app/build/reports/lint-results-release.txt final-output/reports/ 2>/dev/null || true

      - name: Static analysis with detekt and ktlint
        run: |
          set -euo pipefail
          if [ -z "$(find . -name '*.kt' -not -path './.git/*' -not -path './tools/.cache/*' -print -quit)" ]; then
            echo "This repository contains no Kotlin sources, detekt and ktlint have nothing to report."
            echo "They are part of the pipeline so that Kotlin code is checked automatically."
            exit 0
          fi

          echo "Running detekt"
          DETEKT_VERSION=1.23.7
          curl -fsSL --retry 3 -o /tmp/detekt.zip \
            "https://github.com/detekt/detekt/releases/download/v${DETEKT_VERSION}/detekt-cli-${DETEKT_VERSION}.zip"
          rm -rf /tmp/detekt && unzip -q /tmp/detekt.zip -d /tmp/detekt
          java -jar /tmp/detekt/detekt-cli-${DETEKT_VERSION}-all.jar \
            --input . --build-upon-default-config --report xml:detekt-report.xml \
            --report txt:detekt-report.txt || DETEKT_FAILED=1
          mkdir -p final-output/reports
          cp -f detekt-report.* final-output/reports/ 2>/dev/null || true
          [ "${DETEKT_FAILED:-0}" = "0" ] || { echo "[FAIL] detekt reported findings"; exit 1; }

          echo "Running ktlint"
          KTLINT_VERSION=1.5.0
          curl -fsSL --retry 3 -o /tmp/ktlint \
            "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          chmod +x /tmp/ktlint
          /tmp/ktlint "**/*.kt" || { echo "[FAIL] ktlint reported findings"; exit 1; }

      - name: Collect, inspect and sign-verify the APK
        id: collect
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/final-output"
          mkdir -p "$OUT/apk" "$OUT/reports" "$OUT/logs"

          APK=""
          for candidate in app/build/outputs/apk/release/UbuntuTerm-arm64-v8a.apk \
                           app/build/outputs/apk/release/*.apk; do
            if [ -f "$candidate" ]; then APK="$candidate"; break; fi
          done
          if [ -z "$APK" ]; then
            echo "[FAIL] No APK was produced"
            exit 1
          fi
          echo "APK=$APK" >> "$GITHUB_OUTPUT"

          cp -v "$APK" "$OUT/apk/UbuntuTerm-arm64-v8a.apk"
          cp -v termux-packages/output/bootstrap-aarch64-audit.txt "$OUT/logs/" 2>/dev/null || true
          cp -v termux-packages/output/bootstrap-aarch64-build.log "$OUT/logs/" 2>/dev/null || true

          AAPT2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"

          {
            echo "=== UbuntuTerm APK verification report ==="
            echo "APK: $APK"
            echo "Size: $(stat -c%s "$APK") bytes"
            echo ""
            echo "--- aapt2 badging ---"
            "$AAPT2" dump badging "$APK" | tee "$OUT/reports/badging.txt"
            echo ""
            echo "--- Package identity ---"
            grep -E "^package:" "$OUT/reports/badging.txt"
            grep -q "name='com.ubutumerm.app'" "$OUT/reports/badging.txt" || { echo "[FAIL] Wrong package id"; exit 1; }
            echo "[PASS] package id is com.ubutumerm.app"
            grep -q "application-label:'UbuntuTerm'" "$OUT/reports/badging.txt" || { echo "[FAIL] Wrong application label"; exit 1; }
            echo "[PASS] application label is UbuntuTerm"
            echo ""
            echo "--- ABI validation ---"
            grep -E "^native-code:" "$OUT/reports/badging.txt" | tee -a "$OUT/reports/badging.txt"
            if grep -E "^native-code:" "$OUT/reports/badging.txt" | grep -qE "armeabi-v7a|(^|[^a-z0-9])x86(_64)?([^a-z0-9]|$)"; then
              echo "[FAIL] The APK contains native libraries for an unsupported ABI"
              exit 1
            fi
            echo "[PASS] Only arm64-v8a native libraries are present"
            echo ""
            echo "--- Native libraries inside the APK ---"
            unzip -l "$APK" | grep -E "lib/.*\.so$" | tee "$OUT/reports/native-libs.txt"
            if unzip -l "$APK" | grep -E "lib/" | grep -vE "lib/arm64-v8a/" | grep -q .; then
              echo "[FAIL] The APK contains native libraries outside of lib/arm64-v8a"
              exit 1
            fi
            echo "[PASS] No native library outside of lib/arm64-v8a"
            echo ""
            echo "--- Signature validation ---"
            "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$OUT/reports/signature.txt"
            echo ""
            echo "--- Bundled Ubuntu rootfs asset ---"
            unzip -l "$APK" | grep -E "assets/ubuntu/" | tee -a "$OUT/reports/assets.txt"
          } 2>&1 | tee "$OUT/reports/apk-verification-report.txt"

          (cd "$OUT" && find apk reports logs -type f -exec sha256sum {} + | sort -k2 > SHA256SUMS.txt)
          cat "$OUT/SHA256SUMS.txt"

          echo "apk_path=$OUT/apk/UbuntuTerm-arm64-v8a.apk" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$(sha256sum "$OUT/apk/UbuntuTerm-arm64-v8a.apk" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "apk_size=$(stat -c%s "$OUT/apk/UbuntuTerm-arm64-v8a.apk")" >> "$GITHUB_OUTPUT"
          echo "signed=${{ steps.signing.outputs.signed }}" >> "$GITHUB_OUTPUT"

      - name: Upload the UbuntuTerm APK and reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: UbuntuTerm-arm64-v8a
          path: final-output/
          retention-days: 30
          if-no-files-found: warn

  notify:
    name: Telegram delivery
    needs: build
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Download the built APK
        if: ${{ needs.build.result == 'success' }}
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: UbuntuTerm-arm64-v8a
          path: delivery

      - name: Send the APK and the status message to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUILD_RESULT: ${{ needs.build.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          VERSION_NAME: 1.0.0
          VERSION_CODE: 1
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "[WARN] Telegram secrets are not configured, skipping the notification."
            exit 0
          fi

          if [ "$BUILD_RESULT" != "success" ]; then
            MESSAGE=$(cat <<EOF
          ❌ فشل بناء UbuntuTerm

          المرحلة: بناء APK (Bootstrap + Gradle + التحقق)
          Commit: $COMMIT_SHA
          الإصدار: $VERSION_NAME ($VERSION_CODE)
          المعمارية: arm64-v8a
          رابط البناء: $RUN_URL
          EOF
            )
            curl -sS --max-time 60 -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "parse_mode=HTML" \
              --data-urlencode "text=${MESSAGE}" \
              -o /tmp/tg-response.json || true
            echo "[INFO] Failure notification sent (build result: $BUILD_RESULT)"
            exit 0
          fi

          APK="delivery/apk/UbuntuTerm-arm64-v8a.apk"
          SHA256_FILE="delivery/SHA256SUMS.txt"

          if [ ! -f "$APK" ]; then
            echo "[ERROR] The APK artifact was not found"
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$APK")
          APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')
          TEST_RESULTS=$(grep -E "UbuntuTerm-arm64-v8a.apk" "$SHA256_FILE" 2>/dev/null | head -n 1 || true)

          CAPTION=$(cat <<EOF
          ✅ UbuntuTerm build completed successfully

          التطبيق: UbuntuTerm
          Package ID: com.ubutumerm.app
          Version: $VERSION_NAME ($VERSION_CODE)
          Commit SHA: $COMMIT_SHA
          Architecture: arm64-v8a
          APK Size: $APK_SIZE bytes
          SHA256: $APK_SHA256
          Build Status: success
          GitHub Actions: $RUN_URL
          EOF
          )

          LIMIT=52428800
          if [ "$APK_SIZE" -le "$LIMIT" ]; then
            echo "[INFO] Uploading the APK to Telegram..."
            set +e
            curl -sS --max-time 900 -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@${APK};filename=UbuntuTerm-arm64-v8a.apk;type=application/vnd.android.package-archive" \
              -F "caption=${CAPTION}" \
              -o /tmp/tg-document.json
            CURL_EXIT=$?
            set -e
            if [ "$CURL_EXIT" -eq 0 ]; then
              OK=$(jq -r '.ok // false' /tmp/tg-document.json 2>/dev/null || echo false)
              DESC=$(jq -r '.description // ""' /tmp/tg-document.json 2>/dev/null || echo "")
              if [ "$OK" = "true" ]; then
                echo "[PASS] The APK was sent to Telegram (sendDocument ok=true)"
              else
                echo "[ERROR] Telegram sendDocument failed: $DESC"
              fi
            else
              echo "[ERROR] curl failed while sending the APK (exit code $CURL_EXIT)"
            fi
          else
            echo "[WARN] The APK is larger than the 50 MB Telegram Bot API limit, sending the link instead."
            CAPTION="${CAPTION}

          ⚠️ لم يتم إرسال الملف كمرفق لأن حجمه يتجاوز حد Telegram Bot API (50 MB).
          الملف متاح من رابط GitHub Actions Artifact أعلاه."
          fi

          MESSAGE=$(cat <<EOF
          ✅ UbuntuTerm build completed successfully

          التطبيق: UbuntuTerm
          Package ID: com.ubutumerm.app
          الإصدار: $VERSION_NAME ($VERSION_CODE)
          Commit SHA: $COMMIT_SHA
          المعمارية: arm64-v8a
          حجم APK: $APK_SIZE bytes
          SHA256: $APK_SHA256
          نتيجة الاختبارات: تم التحقق من التوقيع والمعمارية ومعرّف الحزمة (apksigner / aapt2 / unzip)
          رابط GitHub Actions: $RUN_URL
          رابط التنزيل (Artifact): $RUN_URL/artifacts
          EOF
          )

          set +e
          curl -sS --max-time 60 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${MESSAGE}" \
            -o /tmp/tg-message.json
          CURL_EXIT=$?
          set -e
          if [ "$CURL_EXIT" -eq 0 ]; then
            OK=$(jq -r '.ok // false' /tmp/tg-message.json 2>/dev/null || echo false)
            DESC=$(jq -r '.description // ""' /tmp/tg-message.json 2>/dev/null || echo "")
            if [ "$OK" = "true" ]; then
              echo "[PASS] The status message was sent to Telegram (sendMessage ok=true)"
            else
              echo "[ERROR] Telegram sendMessage failed: $DESC"
            fi
          else
            echo "[ERROR] curl failed while sending the status message (exit code $CURL_EXIT)"
          fi
